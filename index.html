<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KITS LMS | Examination Platform</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <script>
        // High-speed authoritative initial routing gateway
        (function() {
            try {
                var urlParams = new URLSearchParams(window.location.search);
                var examParam = urlParams.get("examId");

                // 1. Check Admin Session
                var adminSession = null;
                try {
                    adminSession = JSON.parse(
                        localStorage.getItem("kits_lms_admin_session") ||
                        sessionStorage.getItem("kits_lms_admin_session") ||
                        localStorage.getItem("mocktest_admin_session") ||
                        "null"
                    );
                } catch(e) {}

                if (adminSession && adminSession.token && adminSession.role === "admin") {
                    window.location.replace("admin-dashboard.html");
                    return;
                }

                // 2. Check Student Session
                var studentSession = null;
                try {
                    studentSession = JSON.parse(
                        localStorage.getItem("kits_lms_auth_session") ||
                        sessionStorage.getItem("kits_lms_auth_session") ||
                        "null"
                    );
                } catch(e) {}

                var legacyRoll = localStorage.getItem("mocklab_roll");
                var hasStudentSession = Boolean((studentSession && studentSession.roll) || legacyRoll);

                // If explicit exam launch requested with valid session
                if (examParam && hasStudentSession) {
                    window.location.replace("exam.html" + window.location.search);
                    return;
                }

                if (hasStudentSession) {
                    // Authenticated student -> Dashboard (never exam directly)
                    window.location.replace("dashboard.html");
                    return;
                }

                // Unauthenticated user -> Login portal (auth.html)
                window.location.replace("auth.html");
            } catch (err) {
                window.location.replace("auth.html");
            }
        })();
    </script>
    <style>
        :root {
            --bg: #faf9f6;
            --border: #e8e4da;
            --text: #1a1a1a;
            --muted: #6b7280;
            --primary: #c59b27;
            --primary-hover: #a67c1e;
            --primary-light: #fbf6ea;
            --primary-border: #e6cca0;
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: "DM Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .gateway-card {
            background: #ffffff;
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.04);
            padding: 40px 32px;
            max-width: 440px;
            width: 100%;
            text-align: center;
        }
        .gateway-logo {
            font-family: "Space Grotesk", sans-serif;
            font-size: 24px;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .gateway-logo span {
            color: var(--primary);
        }
        .gateway-badge {
            display: inline-block;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: var(--primary-light);
            color: var(--primary);
            border: 1px solid var(--primary-border);
            padding: 4px 10px;
            border-radius: 20px;
            margin-bottom: 24px;
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid #f1ede2;
            border-top-color: var(--primary);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .gateway-text {
            font-size: 14px;
            color: var(--muted);
            margin-bottom: 24px;
            line-height: 1.5;
        }
        .gateway-links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            border-top: 1px solid var(--border);
            padding-top: 20px;
        }
        .gateway-link {
            display: block;
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
        }
        .gateway-link-primary {
            background: var(--primary);
            color: #ffffff;
        }
        .gateway-link-primary:hover {
            background: var(--primary-hover);
        }
        .gateway-link-secondary {
            background: #ffffff;
            border: 1px solid var(--border);
            color: var(--text);
        }
        .gateway-link-secondary:hover {
            background: #fdfcf9;
        }
    </style>
</head>
<body>
    <div class="gateway-card">
        <div class="gateway-logo">
            KITS <span>LMS</span>
        </div>
        <div class="gateway-badge">Examination Platform</div>
        <div class="spinner"></div>
        <div class="gateway-text">
            Connecting to secure institutional portal...
        </div>
        <div class="gateway-links">
            <a href="auth.html" class="gateway-link gateway-link-primary">Student Sign In →</a>
            <a href="admin-login.html" class="gateway-link gateway-link-secondary">Faculty &amp; Admin Console →</a>
        </div>
    </div>
</body>
</html>
